[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# The SQLAlchemy model is named Test (src/models/test.py); pytest's default
# python_classes = Test* glob matches on a class's own __name__, so importing
# it into any test file triggers this warning regardless of import alias.
# Harmless: it just declines to collect the ORM class as a test class.
filterwarnings =
    ignore:cannot collect test class 'Test' because it has a __init__ constructor:UserWarning
